spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never
  cache:
    type: none
  kafka:
    admin:
      auto-create: false
    listener:
      auto-startup: false

eureka:
  client:
    enabled: false

management:
  tracing:
    enabled: false
